name: 'Android CI'

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.welcome.provider.enabled=false"
  APP_NAME: "BreezeLauncherPreloaderSupport"
  JAVA_VERSION: "21"
  ARTIFACT_RELEASE_TAG: "artifact"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache submodules
        id: cache-submodules
        uses: actions/cache@v4
        with:
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}-${{ runner.os }}
          restore-keys: submodules-${{ hashFiles('.gitmodules') }}-

      - name: Init submodules
        run: git submodule update --init --recursive --depth=1
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        timeout-minutes: 8

      - name: Cache build outputs
        uses: actions/cache@v4
        with:
          path: |
            app/build
            minecraft/build
            minecraft-msftauth/build
          key: build-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle') }}-${{ hashFiles('app/src/main/res/**/strings.xml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle') }}-${{ hashFiles('app/src/main/res/**/strings.xml') }}-

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine build type
        id: apk_name
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "build_type=release" >> $GITHUB_OUTPUT
            echo "assemble_task=assembleRelease" >> $GITHUB_OUTPUT
            echo "apk_dir=app/build/outputs/apk/release" >> $GITHUB_OUTPUT
            echo "final_name=${{ env.APP_NAME }}-${{ github.ref_name }}.apk" >> $GITHUB_OUTPUT
          else
            echo "build_type=debug" >> $GITHUB_OUTPUT
            echo "assemble_task=assembleDebug" >> $GITHUB_OUTPUT
            echo "apk_dir=app/build/outputs/apk/debug" >> $GITHUB_OUTPUT
            echo "final_name=${{ env.APP_NAME }}-dev-${GITHUB_SHA::7}.apk" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: |
          echo "Building ${{ steps.apk_name.outputs.build_type }} APK..."
          ./gradlew ${{ steps.apk_name.outputs.assemble_task }} --no-daemon --parallel --build-cache --warn

      - name: Decode and setup keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Sign APK with custom keystore
        run: |
          APK_IN=$(find ${{ steps.apk_name.outputs.apk_dir }} -name "*.apk" | head -1)
          APK_OUT="${{ env.APP_NAME }}-${{ steps.apk_name.outputs.build_type }}-signed.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          java -jar $BUILD_TOOLS/lib/apksigner.jar sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$APK_OUT" \
            "$APK_IN"
          mv "$APK_OUT" "${{ steps.apk_name.outputs.final_name }}"
          rm -f "$APK_IN" keystore.jks

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          java -jar $BUILD_TOOLS/lib/apksigner.jar verify --print-certs "${{ steps.apk_name.outputs.final_name }}"

      - name: Ensure artifact release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view ${{ env.ARTIFACT_RELEASE_TAG }} 2>/dev/null; then
            echo "Creating artifact release: ${{ env.ARTIFACT_RELEASE_TAG }}"
            gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
              --title "Artifact Storage" \
              --notes "Temporary storage for build artifacts. Do not delete." \
              --draft=false --prerelease=false
          else
            echo "Artifact release already exists."
          fi

      - name: Upload APK to artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="${{ steps.apk_name.outputs.final_name }}"
          gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$APK_FILE" 2>/dev/null || true
          gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$APK_FILE" --clobber
          echo "Uploaded $APK_FILE to artifact release"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "${{ env.APP_NAME }} ${{ github.ref_name }}"
          files: ${{ steps.apk_name.outputs.final_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup stale build caches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --key "build-" --json id,key,lastAccessedAt --limit 200 | \
            python3 -c '
          import sys, json, datetime
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=7)
          for c in json.load(sys.stdin):
              la = datetime.datetime.fromisoformat(c["lastAccessedAt"].replace("Z", "+00:00"))
              if la < cutoff:
                  print(c["id"])
          ' | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting stale cache id=$id"
              gh cache delete "$id" --confirm || true
            fi
          done
